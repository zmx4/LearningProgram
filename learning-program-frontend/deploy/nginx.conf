# ============================================================================
# 学习平台前端 —— 生产部署用的 Nginx 站点配置
#
# 用法概览（详细步骤见 docs/DEPLOYMENT.md）：
#   1. 构建前端：cd learning-program-frontend && pnpm install && pnpm run build
#   2. 把 dist/ 里的内容上传到下面 root 指向的目录（默认 /var/www/learning-program）
#   3. 按需修改 server_name 与 root
#   4. 放到 /etc/nginx/conf.d/learning-program.conf（或 sites-available/ 后建软链）
#   5. nginx -t && nginx -s reload
#
# 设计要点：
#   * 前端与 /api 挂在同一个域名下，浏览器始终请求同源，因此不涉及跨域（CORS）。
#     这也是 .env.example 里建议 VITE_API_BASE_URL 留空的原因。
#   * 前端路由使用 history 模式，直接访问 /discussions/3 或刷新页面时必须回退到 index.html。
# ============================================================================

server {
    listen      80;
    listen      [::]:80;
    server_name _;                                  # 改成你的域名，例如 learning.example.com

    root        /var/www/learning-program;          # dist/ 内容所在目录
    index       index.html;

    charset     utf-8;
    server_tokens off;                              # 不在响应头里暴露 nginx 版本

    # 后端 Spring Boot 服务地址。前端通过同源的 /api 访问，由这里转发过去。
    # 后端在另一台机器时改成 http://192.168.1.10:1231（见文件末尾关于内网信任的说明）。
    #
    # 后端允许最大 55MB 的学习资源上传，而 nginx 默认只放行 1MB，
    # 不调整的话上传稍大的文件会被 nginx 直接以 413 拒绝、根本到不了后端。
    client_max_body_size 60m;

    # ---------------------------------------------------------------- 压缩 ----
    gzip            on;
    gzip_vary       on;
    gzip_min_length 1024;
    gzip_comp_level 5;
    gzip_proxied    any;
    gzip_types      text/plain text/css text/javascript
                    application/javascript application/json application/xml
                    image/svg+xml font/woff font/woff2;

    # ------------------------------------------------------------ 安全响应头 ----
    # 注意：nginx 的 add_header 一旦在子 location 里出现，就会**完全覆盖**server 级的设置。
    # 所以下面所有 location 都只用 expires 控制缓存、不写 add_header，
    # 这三行才能继承到每个响应上。后续要加 Cache-Control 之类的头时请留意这个坑。
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options        SAMEORIGIN always;
    add_header Referrer-Policy        strict-origin-when-cross-origin always;

    # 隐藏文件不对外（保留 .well-known，供 certbot 申请证书时做 HTTP-01 校验）。
    # 放在所有正则 location 的最前面：nginx 的正则是「先匹配到就用」，
    # 若排在后面前缀匹配资源的那条之后，/.foo.png 这类文件会被当成静态资源直接放出去。
    location ~ /\.(?!well-known) {
        deny all;
    }

    # --------------------------------------------------------------- HTML 入口 ----
    # 入口文件绝不能缓存，否则发布新版本后用户仍会加载旧的 assets 引用。
    # expires -1 等价于 Cache-Control: no-cache（每次使用前先向服务端确认）。
    # 这一条覆盖 index.html、预渲染页面、以及 SPA 兜底页 spa.html。
    location ~ \.html$ {
        expires -1;
    }

    # --------------------------------------------- 带内容 hash 的静态资源（长缓存） ----
    # Vite 产物放在 assets/ 下、文件名自带内容 hash，可以放心长缓存。
    # 这里故意不做 SPA 回退：缺失的资源必须返回 404，
    # 否则浏览器会拿到一份 index.html 当 JS 执行，报错信息会非常难查。
    # 用 ^~ 让下面的正则不再参与匹配，保证 assets/ 的策略不被覆盖。
    location ^~ /assets/ {
        try_files $uri =404;
        expires   1y;                               # Cache-Control: max-age=31536000
        access_log off;
    }

    # 图标、字体等固定名称的资源，缓存短一些
    location ~* \.(?:ico|png|jpe?g|gif|svg|webp|woff2?|ttf|eot)$ {
        try_files $uri =404;
        expires   30d;
        access_log off;
    }

    # ------------------------------------------------------------------ /api ----
    location /api/ {
        proxy_pass         http://127.0.0.1:1231;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        # 后端按客户端 IP 做限流（FlowLimitFilter 读 getRemoteAddr）。
        # 必须带上这个头，配合后端的 server.forward-headers-strategy=native，
        # 否则所有用户都会被算成同一个 IP（nginx 自己），共享同一份限流额度。
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;

        proxy_connect_timeout 10s;
        proxy_read_timeout    60s;
        proxy_send_timeout    60s;
    }

    # -------------------------------------------------------- SPA 路由回退 ----
    # 前端用 history 模式：服务端并不存在 /discussions/3 这样的文件，必须回退到兜底页。
    #
    # 三个候选依次是：
    #   $uri              普通文件与子目录（请求 / 时会走到目录，再交给 index 指令）
    #   $uri/index.html   预渲染页面。写在这里而不是用 $uri/，是为了**避免 301**：
    #                     若交给 $uri/ 命中目录，nginx 会把 /register 301 跳到 /register/。
    #   /spa.html         其余路由的兜底空壳
    #
    # 注意兜底目标是 spa.html 而不是 index.html：构建时 index.html 已经被预渲染成
    # 登录页，若让受保护路由也返回它，客户端会拿登录页的 DOM 去做 hydration，必然对不上。
    # spa.html 是未预渲染的空壳，由 entry-client.ts 做一次干净渲染。
    location / {
        try_files $uri $uri/index.html /spa.html;
    }
}

# ============================================================================
# 可选：HTTPS
#
# 生产建议开启。用 certbot 申请证书后，把上面的 80 端口 server 改成跳转：
#
#   server {
#       listen 80;
#       listen [::]:80;
#       server_name learning.example.com;
#       return 301 https://$host$request_uri;
#   }
#
# 再复制一份上面的 server 块，把监听改成 443 并补上证书配置：
#
#   server {
#       listen 443 ssl;
#       listen [::]:443 ssl;
#       http2 on;
#       server_name learning.example.com;
#
#       ssl_certificate     /etc/letsencrypt/live/learning.example.com/fullchain.pem;
#       ssl_certificate_key /etc/letsencrypt/live/learning.example.com/privkey.pem;
#       ssl_protocols       TLSv1.2 TLSv1.3;
#       ssl_session_cache   shared:SSL:10m;
#       ssl_session_timeout 1h;
#
#       # 其余 location、root、add_header 与 80 端口那份完全一致
#   }
# ============================================================================
# 说明：X-Forwarded-For 只有在「请求确实来自可信代理」时才会被后端采纳。
# Spring Boot 默认信任 127.0.0.1 与内网网段；如果 nginx 与后端不在同一台机器，
# 需要额外配置 server.tomcat.remoteip.internal-proxies 把 nginx 的地址加进去，
# 否则后端会把 nginx 的 IP 当成客户端 IP。
# ============================================================================
