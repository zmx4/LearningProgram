spring:
  security:
    jwt:
      key: erasfiluhbnselir
      expire: 144
    email:
      enable: false
  application:
    name: learning-program-backend
  banner:
    charset: utf-8
  datasource:
    # MySQL 连接信息通过环境变量注入，真实账号密码不入库（见 docs/INSTALLATION.md 的环境变量清单）
    username: ${MYSQL_USERNAME:}
    password: ${MYSQL_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver
    # rewriteBatchedStatements 让 saveBatch 真正合并成多值 INSERT；服务端预编译缓存减少解析开销
    url: jdbc:mysql://${MYSQL_HOST:127.0.0.1}:${MYSQL_PORT:3306}/learning?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true&rewriteBatchedStatements=true&useServerPrepStmts=true&cachePrepStmts=true
    # 默认 Hikari 只有 10 个连接，Tomcat 默认 200 线程，慢查询一来线程全在等连接
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 3000
      max-lifetime: 1800000
      keepalive-time: 60000
  data:
    redis:
      host: ${REDIS_HOST:127.0.0.1}
      port: ${REDIS_PORT:6379}
      # 未设置时视为无密码
      password: ${REDIS_PASSWORD:}
      # 默认命令超时是 60s，Redis 抖动会把请求线程长时间挂住
      timeout: 2s
      connect-timeout: 2s
  servlet:
    multipart:
      max-file-size: 55MB
      max-request-size: 60MB
  # 发信配置：只有 learning.mail.delivery=smtp 时才会用到，账号密码由环境变量注入
  mail:
    host: ${MAIL_HOST:}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
  rabbitmq:
    host: ${RABBITMQ_HOST:127.0.0.1}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:guest}
    password: ${RABBITMQ_PASSWORD:guest}
    # 本地没有 broker 时不要让连接超时拖慢接口：3 秒连不上就走回退
    connection-timeout: 3s
learning:
  resources:
    # 学习资源文件的存储目录（相对路径基于后端进程工作目录）
    upload-dir: ./uploads/resources
  mail:
    # 验证码投递方式：log=只写日志（开发默认，无需 SMTP）；smtp=真实发信
    delivery: log
    # 发件人；delivery=smtp 时应改成与 SMTP 账号一致的地址
    from: ${MAIL_FROM:no-reply@learning.local}
    queue:
      # 是否通过 RabbitMQ 异步投递。开着但 broker 连不上会自动回退为直接发送
      enabled: false
      exchange: learning.mail.exchange
      queue-name: learning.mail.queue
      routing-key: learning.mail.send
    code:
      length: 6
      # 有效期（秒）
      ttl-seconds: 300
      # 同一邮箱两次请求的最小间隔（秒）
      interval-seconds: 60
  password:
    # 密码强度策略：规则链的启用开关与阈值都在这里，改策略不需要改代码。
    # 完整的规则清单可通过 GET /api/auth/password-policy 查看。
    policy:
      min-length: 8
      max-length: 32
      require-uppercase: true
      require-lowercase: true
      require-digit: true
      require-special: true
      # 禁止密码中出现空格等空白字符
      forbid-whitespace: true
      # 禁止密码包含用户名 / 邮箱
      forbid-account-info: true
      # 拒绝常见弱密码（词表默认写在 PasswordPolicyProperties 里，可在此覆盖）
      reject-common-passwords: true
      # 管理员重置密码时生成的随机密码长度
      generated-length: 12
      # 生成随机密码可用的特殊字符
      special-characters: "!@#$%^&*()-_=+[]{};:,.?/|~"
server:
  port: 1231
  # 部署在 nginx 等反向代理后面时，按 X-Forwarded-For 还原真实客户端 IP。
  # FlowLimitFilter 用 request.getRemoteAddr() 做限流，若不还原，
  # 所有用户都会被当成代理的 IP、共享同一份限流额度（10 次 / 3 秒）。
  # 本地直连（没有该请求头）时行为不变；只有可信代理发来的头才会被采纳。
  forward-headers-strategy: native